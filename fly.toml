app = "tombell-manchester-drive"
primary_region = "lhr"
# Fly stops the running server with this signal before starting the new image.
kill_signal = "SIGTERM"
kill_timeout = "10s"

# Blue-green needs a second machine, but the data volume attaches to one machine at a time.
[deploy]
  strategy = "rolling"

[env]
  HOST = "0.0.0.0"
  PORT = "4173"
  DATABASE_PATH = "/data/game.db"

# One volume ties the app to one machine, as the in-memory room already does.
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "5s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
